services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: gridclean
      POSTGRES_PASSWORD: gridclean
      POSTGRES_DB: gridclean
    ports:
      - "5433:5432"
    volumes:
      - gridclean_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridclean"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://gridclean:gridclean@db:5432/gridclean
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gridclean_pgdata:
