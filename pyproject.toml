[project]
name = "gridclean"
version = "0.1.0"
description = "Live carbon intensity of electricity by location — a data-fusion API with an AI layer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "anthropic>=0.49",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migration files are auto-generated; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses callable defaults (Depends(), Query()) by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Seed data is an intentionally column-aligned table; let lines run long.
"app/seed/data.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
